<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastSigner Legal</title>
  <meta name="description" content="FastSigner privacy policy and terms of use.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #080808;
      --muted: #5d6675;
      --line: #dce3ee;
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 42px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 18px;
    }
    nav {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }
    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      background: #fff;
    }
    a:hover {
      border-color: var(--accent);
    }
    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>FastSigner</h1>
      <p>Legal documents and support for FastSigner, a PDF signing app for iPhone.</p>
      <nav aria-label="Legal documents">
        <a href="support.html">Support</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-use.html">Terms of Use</a>
      </nav>
      <footer>Contact: masalappfactory@gmail.com</footer>
    </section>
  </main>
</body>
</html>
